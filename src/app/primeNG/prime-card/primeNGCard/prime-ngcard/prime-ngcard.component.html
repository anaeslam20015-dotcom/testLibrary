<div class="container my-5">
  @if (loading) {
    <div class="d-flex justify-content-center row g-3">
      @for (card of Cards; track $index) {
        <div class="col-12 col-lg-3 col-md-4 col-sm-6">
          <p-card [style]="{ width: '300px', height: '700px' }">
            <ng-template pTemplate="header">
              <img class="rounded-top-2" alt="Card" [src]="card.images" />
            </ng-template>
            <p>
              {{ card.description }}
            </p>
            <ng-template pTemplate="footer">
              <div class="d-flex justify-content-center gap-3 mt-1">
                <p-button label="Cancel" severity="secondary" />
                <p-button label="Save" />
              </div>
            </ng-template>
          </p-card>
        </div>
      }
    </div>
  } @else {
    <div class="d-grid justify-content-center">
      <p-progressSpinner
        ariaLabel="loading"
        [style]="{ width: '70px', height: '100px' }"
        strokeWidth="3"
        fill="transparent"
        animationDuration="1s"
        class="mt-5"
      />
    </div>
  }
</div>
