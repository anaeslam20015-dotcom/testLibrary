<div class="container mt-5">
  <div class="cont py-5">
    <h1 class="mt-3">Form Field</h1>
    <div class="form" [formGroup]="testForm">
      <div class="NA-EM">
        <mat-form-field appearance="outline" color="primary">
          <mat-label>Name</mat-label>
          <input matInput type="text" formControlName="Name" />

          <mat-error> Name is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" color="primary">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="Email" />

          <mat-error> Email is required</mat-error>
        </mat-form-field>
      </div>
      <mat-form-field appearance="outline" color="primary" class="mt-2">
        <mat-label>Salary</mat-label>
        <input matInput type="number" formControlName="Salary" />

        <mat-error> Salary is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" color="primary" class="mt-2">
        <mat-label>Department</mat-label>
        <mat-select formControlName="Department">
          <mat-option value="one">Frontend</mat-option>
          <mat-option value="two">Backend</mat-option>
          <mat-option value="three">HR</mat-option>
          <mat-option value="four">Marketing</mat-option>
          <mat-option value="four">Sales</mat-option>
        </mat-select>

        <mat-error> Department is required</mat-error>
      </mat-form-field>

      <button mat-raised-button type="submit" color="accent" class="w-50 mt-2">
        Submit
      </button>
    </div>
  </div>
</div>
