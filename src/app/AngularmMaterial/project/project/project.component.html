<div class="container my-4">
  <div class="shipment">
    <div class="order table-responsive">
      <div class="total">
        <div class="right">
          <mat-icon class="car">local_shipping</mat-icon>
        </div>
        <div class="left">
          <h3>Total Shipments :</h3>
          <p>215%</p>
        </div>
      </div>
      <div class="active">
        <div class="right">
          <mat-icon class="box">inventory_2</mat-icon>
        </div>
        <div class="left">
          <h3>Active Orders :</h3>
          <p>{{ shipments.length }}</p>
        </div>
      </div>
    </div>
    <div class="table table-responsive rounded-3">
      <button mat-raised-button color="primary" class="my-2" (click)="addShipment()">
        + Add New Shipment
      </button>
      <table mat-table [dataSource]="shipments" class="mat-elevation-z2">
        <!-- ID Column -->
        <ng-container matColumnDef="ID">
          <th mat-header-cell *matHeaderCellDef class="bg-dark text-white">
            ID
          </th>
          <td mat-cell *matCellDef="let element">{{ element.id }}</td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="Customer Name">
          <th mat-header-cell *matHeaderCellDef class="bg-dark text-white">
            Name
          </th>
          <td mat-cell *matCellDef="let element">{{ element.customerName }}</td>
        </ng-container>

        <!-- City Column -->
        <ng-container matColumnDef="City">
          <th mat-header-cell *matHeaderCellDef class="bg-dark text-white">
            City
          </th>
          <td mat-cell *matCellDef="let element">{{ element.city }}</td>
        </ng-container>

        <!-- Carrier Column -->
        <ng-container matColumnDef="Carrier">
          <th mat-header-cell *matHeaderCellDef class="bg-dark text-white">
            Carrier
          </th>
          <td mat-cell *matCellDef="let element">{{ element.carrier }}</td>
        </ng-container>

        <!-- Data Column -->
        <ng-container matColumnDef="Data Shipped">
          <th mat-header-cell *matHeaderCellDef class="bg-dark text-white">
            Data Shipped
          </th>
          <td mat-cell *matCellDef="let element">{{ element.dateShipped }}</td>
        </ng-container>

        <!-- Status Column -->
        <ng-container matColumnDef="Status">
          <th mat-header-cell *matHeaderCellDef class="bg-dark text-white">
            Status
          </th>
          <td mat-cell *matCellDef="let element">
            {{ element.status }}
          </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="Actions">
          <th mat-header-cell *matHeaderCellDef class="bg-dark text-white">
            Actions
          </th>
          <td mat-cell *matCellDef="let element">
            <button
              mat-icon-button
              (click)="element.showVisibility = !element.showVisibility"
            >
              <mat-icon>
                {{ element.showVisibility ? "visibility" : "visibility_off" }}
              </mat-icon>
            </button>
            <button
              mat-icon-button
              color="warn"
              (click)="deleteShipment(element.id)"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  </div>
</div>
